name: Publish prepared 0.6.0 release

on:
  push:
    branches: [release/publish-0.6.0]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out prepared release manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download successful GitHub build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ChessPilot-unsigned-0808f792dca145bff8b2c63770ac6c6025738617
          path: ci-artifacts
          github-token: ${{ github.token }}
          run-id: 44124086371

      - name: Verify prepared signed APK and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_prepared_release.py
