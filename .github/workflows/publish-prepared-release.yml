name: Publish prepared 0.6.6 release

on:
  push:
    branches: [release/publish-0.6.6]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out prepared release manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download successful GitHub build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ChessPilot-unsigned-35945ec4886dfca413458f2239151506d3819948
          path: ci-artifacts
          github-token: ${{ github.token }}
          run-id: 44906149940

      - name: Verify prepared signed APK and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_prepared_release.py
